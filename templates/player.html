<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズ回答画面</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>

    <!-- 1. 参加登録画面 -->
    <div id="setup-screen" class="card setup-card">
        <h2>🏆 クイズ大会 🏆</h2>
        <p style="margin-top: 10px; color: #666;">お名前を入力して参加してください</p>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="名前を入力..." maxlength="10">
            <button class="btn btn-primary" id="join-btn">参加</button>
        </div>
    </div>

    <!-- 2. メインゲーム画面 -->
    <div id="game-screen" class="card hidden">
        <!-- プレイヤー情報ヘッダー -->
        <div class="player-status-bar">
            <div class="player-name-badge" id="display-name">ゲスト</div>
            <div class="score-info">
                <span>スコア: <strong id="display-score">0</strong> pt</span>
                <span>COMBO: <strong id="display-combo">0</strong></span>
            </div>
        </div>

        <!-- 問題文表示ボックス -->
        <div class="card question-display-box" id="question-box">
            出題をお待ちください...
        </div>

        <!-- タイマー表示 -->
        <div class="timer-container hidden" id="timer-box">
            <div class="timer-bar-wrapper">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
            <div class="timer-text" id="timer-count">残り: 0.0 秒</div>
        </div>

        <!-- 各種メッセージ・正解表示 -->
        <div id="buzz-status-msg" style="margin-top: 10px; font-weight: bold; text-align: center; color: #ff9800;"></div>
        <div class="result-box hidden" id="result-message"></div>
        <div class="result-box result-correct hidden" id="correct-answer-box" style="margin-top: 10px; background: #e8f5e9; color: #2e7d32;"></div>

        <!-- 早押しボタン -->
        <div style="margin-top: 20px;">
            <button class="buzz-button" id="buzz-btn" disabled>
                <span class="buzz-btn-text">PUSH</span>
                <span class="buzz-sub-text">早押し</span>
            </button>
        </div>

        <!-- 解答入力UI -->
        <div class="answer-section hidden" id="answer-ui">
            <!-- 4択UI -->
            <div class="choice-grid hidden" id="ui-choice"></div>

            <!-- 文字選択(mhy)UI -->
            <div class="mhy-container hidden" id="ui-mhy">
                <div class="mhy-display">
                    <span class="mhy-text" id="mhy-entered"></span>
                </div>
                <div class="choice-grid" id="mhy-choice-grid"></div>
            </div>

            <!-- テキスト入力UI -->
            <div class="input-group hidden" id="ui-text">
                <input type="text" id="text-answer-input" placeholder="回答を入力...">
                <button class="btn btn-primary" id="text-submit-btn">送信</button>
            </div>
        </div>
    </div>

    <!-- 3. 問題開始時演出オーバーレイ -->
    <div class="dramatic-overlay hidden" id="dramatic-overlay">
        <div class="dramatic-content">
            <div class="dramatic-num" id="dramatic-num">第 1 問</div>
            <div class="dramatic-type" id="dramatic-type">【 テキスト方式 】</div>
        </div>
    </div>

    <!-- 4. リザルト画面 -->
    <div id="result-screen" class="card hidden" style="max-width: 500px; margin: 30px auto; text-align: center;">
        <h2 style="color: #1e88e5;">🏆 最終結果発表 🏆</h2>
        <div id="my-final-result" style="font-size: 1.2rem; font-weight: bold; margin: 15px 0;"></div>
        <table class="score-table">
            <thead>
                <tr>
                    <th>順位</th>
                    <th>名前</th>
                    <th>スコア</th>
                </tr>
            </thead>
            <tbody id="ranking-list"></tbody>
        </table>
    </div>

    <script src="/static/player.js"></script>
</body>
</html>
