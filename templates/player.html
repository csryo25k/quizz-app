<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クイズ回答画面</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        /* --- 全体レイアウト＆スクロール制御 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* iOS Safari等のツールバー対策 */
            overflow: hidden; /* 外枠のスクロール防止 */
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* 画面共通カードコンテナ */
        .player-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .hidden {
            display: none !important;
        }

        /* --- 1. 参加登録画面 (setup-screen) --- */
        #setup-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 20px;
            text-align: center;
        }

        .join-title {
            font-size: 1.8rem;
            color: #ffca28;
            font-weight: bold;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #fff;
            text-align: center;
            outline: none;
        }

        .input-group input:focus {
            border-color: #00e676;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- 2. メインゲーム画面 (game-screen) --- */
        #game-screen {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            gap: 10px;
        }

        /* ステータスバー（自分情報） */
        .player-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .player-name-badge {
            font-size: 1.1rem;
            color: #ffca28;
        }

        .score-info {
            display: flex;
            gap: 12px;
            font-size: 1.1rem;
        }

        .score-val { color: #00e676; }
        .combo-val { color: #ff9800; }

        /* 参加者一覧エリア（5人以上接続時の自動スクロール設定） */
        .players-list-container {
            width: 100%;
            max-height: 95px;  /* 人数が増えても95pxまでに高さを制限 */
            overflow-y: auto;  /* 溢れた場合は枠内スクロール */
            background: #252525;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #333;
            flex-shrink: 1;    /* 画面が狭い時は自ら縮む */
            -webkit-overflow-scrolling: touch;
        }

        .players-list-title {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        .players-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 問題表示ボックス */
        .question-display-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #282828;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            min-height: 80px;
            font-size: 1.2rem;
            line-height: 1.4;
            font-weight: 600;
            word-break: break-all;
            overflow-y: auto;
        }

        /* タイマー表示 */
        .timer-container {
            flex-shrink: 0;
            width: 100%;
        }

        .timer-bar-wrapper {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #ff5252;
            transition: width 0.05s linear;
        }

        .timer-text {
            text-align: right;
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 2px;
        }

        /* メッセージ・正解表示エリア */
        .msg-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }

        .buzz-status {
            font-size: 0.95rem;
            color: #ffca28;
            font-weight: bold;
        }

        .correct-ans-box {
            background: #1b5e20;
            color: #ffffff;
            padding: 8px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* --- 3. 操作・ボタンエリア（絶対保護エリア） --- */
        .action-area {
            flex-shrink: 0 !important; /* 人数が増えても絶対に領域を潰させない */
            margin-top: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 早押しボタン */
        .buzz-button {
            width: 100%;
            height: 110px;
            min-height: 90px;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #ff1744, #d50000);
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 0 #9b0000, 0 8px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .buzz-button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9b0000, 0 4px 8px rgba(0,0,0,0.4);
        }

        .buzz-button:disabled {
            background: #555555;
            box-shadow: none;
            color: #888888;
            cursor: not-allowed;
        }

        /* 4択UI */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .choice-btn {
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: bold;
            background: #2c3e50;
            color: #fff;
            border: 2px solid #34495e;
            border-radius: 10px;
            cursor: pointer;
            word-break: break-all;
        }

        .choice-btn:active {
            background: #2980b9;
        }

        /* 文字選択(mhy)UI */
        .mhy-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .mhy-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00e676;
            letter-spacing: 2px;
            min-height: 32px;
            text-align: center;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 4px;
        }

        .mhy-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        /* テキスト入力UI */
        .input-group-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .input-group-row input {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #555;
            background: #2a2a2a;
            color: #fff;
            outline: none;
        }

        /* --- 4. ド迫力演出（全画面オーバーレイ） --- */
        .dramatic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .dramatic-content {
            text-align: center;
            color: #ffffff;
        }

        .dramatic-num {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffeb3b;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ff9800;
        }

        .dramatic-type {
            font-size: 1.6rem;
            font-weight: bold;
            color: #00e676;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 28px;
            border-radius: 40px;
            border: 2px solid #00e676;
            display: inline-block;
        }

        /* --- 5. リザルト画面 (result-screen) --- */
        #result-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            height: 100%;
            text-align: center;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .ranking-table th, .ranking-table td {
            padding: 10px;
            border-bottom: 1px solid #444;
            font-size: 0.95rem;
        }

        .ranking-table th {
            background: #333;
            color: #ffca28;
        }
    </style>
</head>
<body>

    <div class="player-container">

        <!-- 1. 参加登録画面 (setup-screen) -->
        <div id="setup-screen">
            <div class="join-title">🏆 クイズ大会 🏆</div>
            <p style="color: #bbb; font-size: 0.95rem;">お名前を入力して参加してください</p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="名前を入力（例: たろう）" maxlength="10">
                <button class="btn-primary" id="join-btn">参加する</button>
            </div>
        </div>

        <!-- 2. メインゲーム画面 (game-screen) -->
        <div id="game-screen" class="hidden">
            <!-- プレイヤー情報ヘッダー -->
            <div class="player-status-bar">
                <div class="player-name-badge" id="display-name">ゲスト</div>
                <div class="score-info">
                    <span>スコア: <span class="score-val" id="display-score">0</span> pt</span>
                    <span>COMBO: <span class="combo-val" id="display-combo">0</span></span>
                </div>
            </div>

            <!-- 参加者一覧（5人以上接続時も自動スクロールしてボタンを圧迫しない） -->
            <div class="players-list-container">
                <div class="players-list-title">👥 参加者一覧</div>
                <div class="players-grid" id="players-list-grid"></div>
            </div>

            <!-- 問題文表示領域 -->
            <div class="question-display-box" id="question-box">ホストが出題を開始するまでお待ちください...</div>

            <!-- タイマー表示 -->
            <div class="timer-container hidden" id="timer-box">
                <div class="timer-bar-wrapper">
                    <div class="timer-bar" id="timer-bar"></div>
                </div>
                <div class="timer-text" id="timer-count">残り: 0.0 秒</div>
            </div>

            <!-- メッセージ・正解表示領域 -->
            <div class="msg-area">
                <div class="buzz-status" id="buzz-status-msg"></div>
                <div class="result-box hidden" id="result-message"></div>
                <div class="correct-ans-box hidden" id="correct-answer-box"></div>
            </div>

            <!-- 3. 操作・解答UIエリア（絶対保護エリア） -->
            <div class="action-area">
                <!-- 早押しボタン -->
                <button class="buzz-button" id="buzz-btn" disabled>
                    <span class="buzz-btn-text">早押し！</span>
                </button>

                <!-- 解答UIコンテナ -->
                <div class="answer-section hidden" id="answer-ui">
                    <!-- 4択UI -->
                    <div class="choice-grid hidden" id="ui-choice"></div>

                    <!-- 文字選択(mhy)UI -->
                    <div class="mhy-container hidden" id="ui-mhy">
                        <div class="mhy-display" id="mhy-entered"></div>
                        <div class="mhy-grid" id="mhy-choice-grid"></div>
                    </div>

                    <!-- テキスト入力UI -->
                    <div class="input-group-row hidden" id="ui-text">
                        <input type="text" id="text-answer-input" placeholder="回答を入力...">
                        <button class="btn-primary" id="text-submit-btn" style="width: 80px;">送信</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. ド迫力演出オーバーレイ -->
        <div class="dramatic-overlay hidden" id="dramatic-overlay">
            <div class="dramatic-content">
                <div class="dramatic-num" id="dramatic-num">第 1 問</div>
                <div class="dramatic-type" id="dramatic-type">【 テキスト方式 】</div>
            </div>
        </div>

        <!-- 5. リザルト画面 (result-screen) -->
        <div id="result-screen" class="hidden">
            <h2 style="color: #ffca28;">🏆 最終結果発表 🏆</h2>
            <div id="my-final-result" style="font-size: 1.3rem; font-weight: bold; margin-top: 10px;"></div>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>名前</th>
                        <th>スコア</th>
                    </tr>
                </thead>
                <tbody id="ranking-list"></tbody>
            </table>
        </div>

    </div>

    <script src="/static/player.js"></script>
</body>
</html>
