<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズ画面 - ディスプレイ</title>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        /* 画面全体を1画面(100vh)に収め、スクロールバーを禁止 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 2vh 3vw;
        }

        /* ヘッダー情報（問題番号・ジャンル等） */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 8vh;
            border-bottom: 2px solid #333;
        }

        .q-number {
            font-size: 3.5vh;
            font-weight: bold;
            color: #ffca28;
        }

        .status-badge {
            font-size: 2.5vh;
            padding: 0.5vh 2vw;
            background-color: #333;
            border-radius: 20px;
        }

        /* 問題文表示エリア（可変高で中央配置） */
        .question-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 0;
            overflow: hidden;
        }

        .question-text {
            font-size: clamp(24px, 4.5vh, 52px);
            line-height: 1.5;
            font-weight: 600;
            word-break: break-all;
            text-align: left;
            width: 100%;
            max-height: 100%;
            overflow-y: auto; /* 万が一極端に長い問題文が来ても崩れを防止 */
        }

        /* 早押しプレイヤー表示エリア */
        .buzzed-player-area {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buzzer-banner {
            font-size: 4vh;
            font-weight: bold;
            color: #ffffff;
            background-color: #e53935;
            padding: 1vh 4vw;
            border-radius: 12px;
            animation: pulse 1s infinite alternate;
            display: none;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        /* 正解・回答発表エリア */
        .result-area {
            height: 12vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e1e1e;
            border-radius: 12px;
            border: 2px solid #ffca28;
            padding: 1vh 2vw;
            display: none;
        }

        .result-label {
            font-size: 3vh;
            color: #ffca28;
            margin-right: 2vw;
        }

        .result-text {
            font-size: 4vh;
            font-weight: bold;
            color: #4caf50;
        }

        /* フッター（プレイヤー順位・スコア） */
        .footer-scores {
            height: 12vh;
            display: flex;
            gap: 1.5vw;
            overflow-x: auto;
            align-items: center;
            border-top: 1px solid #333;
            padding-top: 1vh;
        }

        .score-card {
            background-color: #262626;
            padding: 1vh 1.5vw;
            border-radius: 8px;
            min-width: 140px;
            text-align: center;
            flex-shrink: 0;
        }

        .score-card .p-name {
            font-size: 2vh;
            color: #bbb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-card .p-score {
            font-size: 3vh;
            font-weight: bold;
            color: #00e676;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="q-number" id="qNumber">READY</div>
            <div class="status-badge" id="statusBadge">待機中</div>
        </div>

        <div class="question-area">
            <div class="question-text" id="questionText">問題が開始されるのを待っています...</div>
        </div>

        <div class="buzzed-player-area">
            <div class="buzzer-banner" id="buzzerBanner">ランプ点灯中</div>
        </div>

        <div class="result-area" id="resultArea">
            <div class="result-label">【正解】</div>
            <div class="result-text" id="resultText">-</div>
        </div>

        <div class="footer-scores" id="footerScores">
            <!-- プレイヤー一覧とスコアがここに動的表示されます -->
        </div>
    </div>

    <script>
        const socket = io();

        const qNumber = document.getElementById('qNumber');
        const statusBadge = document.getElementById('statusBadge');
        const questionText = document.getElementById('questionText');
        const buzzerBanner = document.getElementById('buzzerBanner');
        const resultArea = document.getElementById('resultArea');
        const resultText = document.getElementById('resultText');
        const footerScores = document.getElementById('footerScores');

        let charTimer = null;
        let fullQuestionText = "";
        let currentCharIndex = 0;

        // 問題開始時
        socket.on('question_start_player', (data) => {
            resetDisplay();
            qNumber.textContent = `第 ${data.round_q_num || data.id} 問`;
            statusBadge.textContent = "出題中";
            
            fullQuestionText = data.question || "";
            currentCharIndex = 0;
            questionText.textContent = "";

            const charSpeed = (data.char_speed || 0.08) * 1000;

            // 1文字ずつ流すタイマー
            clearInterval(charTimer);
            charTimer = setInterval(() => {
                if (currentCharIndex < fullQuestionText.length) {
                    questionText.textContent += fullQuestionText[currentCharIndex];
                    currentCharIndex++;
                } else {
                    clearInterval(charTimer);
                }
            }, charSpeed);
        });

        // 誰かが早押し（buzz）したとき
        socket.on('player_buzzed_notice', (data) => {
            // 早押しプレイヤーの横断幕を表示
            buzzerBanner.textContent = `⚡ ${data.player_name || 'プレイヤー'} さんが回答中！`;
            buzzerBanner.style.display = 'block';

            // ★ポイント: charTimer を clearInterval しない！
            // ディスプレイ画面では問題文の文字送りを停止せず、そのまま最後まで流し続けます。
        });

        // 不正解通知
        socket.on('player_incorrect_notice', (data) => {
            buzzerBanner.style.display = 'none';
        });

        // スルー（時間切れ・全員不答）
        socket.on('question_through', (data) => {
            finishQuestion(data.correct_answers);
        });

        // 解答発表
        socket.on('answer_result', (data) => {
            finishQuestion(data.correct_answers);
        });

        function finishQuestion(correctAnswers) {
            clearInterval(charTimer);
            // 問題文を最後まで完全表示
            questionText.textContent = fullQuestionText;
            
            buzzerBanner.style.display = 'none';
            statusBadge.textContent = "終了";

            let ansStr = "";
            if (Array.isArray(correctAnswers)) {
                ansStr = correctAnswers.join(" / ");
            } else {
                ansStr = correctAnswers || "";
            }

            resultText.textContent = ansStr;
            resultArea.style.display = 'flex';
        }

        // プレイヤー＆スコア一覧の更新
        socket.on('update_players', (players) => {
            footerScores.innerHTML = "";
            Object.values(players).forEach(p => {
                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <div class="p-name">${escapeHtml(p.name || 'ゲスト')}</div>
                    <div class="p-score">${p.score || 0} pt</div>
                `;
                footerScores.appendChild(card);
            });
        });

        function resetDisplay() {
            clearInterval(charTimer);
            buzzerBanner.style.display = 'none';
            resultArea.style.display = 'none';
            resultText.textContent = "-";
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
